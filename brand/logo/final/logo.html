<!doctype html><meta charset="utf-8"><style>
@font-face { font-family: GSF; src: url(gsf.woff2) format('woff2'); font-weight: 100 1000; }
html, body { margin: 0; background: transparent; }
/* MOONDA wordmark: the ridge-M is the first letter. Google Sans Flex 720, tracking .16em,
   mark 1.3 × cap height on the text baseline, .19em after it. */
.w { display: inline-flex; align-items: baseline; font-family: GSF, sans-serif; font-weight: 720; letter-spacing: .16em; line-height: 1; font-size: 200px; padding: .16em .1em .14em .16em; }
.w img { height: 1.3cap; margin-right: .19em; align-self: baseline; }
.w span { margin-right: -.16em; }
</style>
<div class="w" id="w"><img id="m" src="moonda-mark.svg"><span>OONDA</span></div>
<script>const q = new URLSearchParams(location.search); if (q.get('ink')) { document.getElementById('w').style.color = '#141519'; document.getElementById('m').src = 'moonda-mark-on-light.svg'; } else document.getElementById('w').style.color = '#eeeff1';
document.fonts.ready.then(() => { const r = document.getElementById('w').getBoundingClientRect(); document.title = Math.ceil(r.width) + 'x' + Math.ceil(r.height); });</script>
