<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tab icon: the skyline M mark (MOONDA/brand/logo/final). The SVG follows the browser's light/dark theme. -->
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060a" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="MOONDA — explore the Moon like a map and check any south-pole landing spot for sunlight and Earth view." />
    <title>MOONDA · Moon landing site explorer</title>
    <style>
      /* Shown for the moment before the app's own code has arrived: the same top part as the start screen
         (src/ui/start.css), at the same place, so nothing jumps or flashes when it takes over. */
      html, body { margin: 0; height: 100%; background: #05060a; }
      /* The space video behind the start screen. It is in the page itself so it is the first thing the
         browser downloads; the app waits for it (src/main.tsx) before loading the Moon data. Blur and
         dimming are baked into the file; the shade on top keeps the text readable. The film is cut from
         NASA visualisations, public domain: sources in public/intro/CREDITS.md, built by
         data-prep/intro/make-intro.sh. */
      .intro-bg { position: fixed; inset: 0; z-index: 99; pointer-events: none; background: #05060a url('/intro/space.jpg') center / cover no-repeat; transition: opacity 480ms ease-out; }
      .intro-bg video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; visibility: hidden; }
      .intro-bg.playing video { visibility: visible; }
      #intro-video::-webkit-media-controls,
      #intro-video::-webkit-media-controls-enclosure,
      #intro-video::-webkit-media-controls-panel,
      #intro-video::-webkit-media-controls-start-playback-button,
      #intro-video::-webkit-media-controls-play-button { display: none !important; -webkit-appearance: none; }
      .intro-bg::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 60% 75% at 50% 48%, rgba(5, 6, 10, .46) 0%, rgba(5, 6, 10, .2) 60%, rgba(5, 6, 10, .06) 100%); }
      .intro-bg.gone { opacity: 0; }
      .boot { position: fixed; inset: 0; z-index: 100; box-sizing: border-box; padding-top: max(24px, calc(50vh - 370px * var(--sz, 1))); display: flex; justify-content: center; align-items: flex-start; background: transparent; color: #eeeff1; font-family: 'Google Sans Flex Variable', system-ui, -apple-system, sans-serif; }
      .boot-col { display: flex; flex-direction: column; align-items: center; zoom: var(--sz, 1); }
      /* the logo, drawn exactly like the Wordmark in src/ui/kit.tsx + .wordmark in src/styles.css */
      .boot-name { display: inline-flex; align-items: baseline; font-size: 50px; font-weight: 860; letter-spacing: .05em; line-height: 1; white-space: nowrap; }
      .boot-name svg { display: block; flex: none; align-self: baseline; width: auto; height: .74em; height: 1.03cap; aspect-ratio: 88 / 77; margin: 0 .07em 0 .03em; }
      .boot-name span:last-child { margin-right: -.05em; }
      .boot-tag { margin: 16px 0 0; color: #b3b5bc; font-size: 14px; }
      /* what is loading, drawn like the start screen's list (src/ui/start.css, .start-stages) so it carries straight on */
      .boot-col { width: min(560px, calc(100% - 32px)); }
      .boot-stages { list-style: none; padding: 0; margin: 24px 0 0; width: 100%; border-top: 1px solid rgba(255, 255, 255, .08); }
      .boot-stages li { position: relative; display: flex; align-items: center; gap: 12px; height: 32px; border-bottom: 1px solid rgba(255, 255, 255, .08); font-size: 14px; color: #b3b5bc; }
      .boot-stages li > span:first-child { flex: 1; }
      .boot-stages .on > span:first-child { color: #eeeff1; }
      .boot-stages .q { font-size: 12px; color: #8c8e97; }
      .boot-stages .n { font-family: 'Geist Mono Variable', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; color: #8c8e97; }
      .boot-line { position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; overflow: hidden; }
      .boot-line i { position: absolute; inset: 0; transform-origin: left; transform: scaleX(var(--f, 0)); background: #eeeff1; transition: transform 400ms cubic-bezier(.2, .7, .2, 1); }
      .boot-line.busy i { transform: none; width: 30%; animation: boot-busy 1.4s ease-in-out infinite; }
      .boot-recovery { align-self: stretch; margin-top: 20px; color: #b3b5bc; font-size: 14px; line-height: 1.5; }
      .boot-recovery p { margin: 0 0 12px; }
      .boot-recovery button { padding: 10px 16px; border: 1px solid #eeeff1; border-radius: 10px; background: #eeeff1; color: #05060a; font: inherit; cursor: pointer; }
      @keyframes boot-busy { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
      @media (prefers-reduced-motion: reduce) { .boot-line.busy i { animation: none; width: 100%; opacity: .4; } }
    </style>
    <script>
      // The start screen is drawn at a size that fits the window height: full size from 960 px tall, smaller below.
      (function () { function fit() { document.documentElement.style.setProperty('--sz', String(Math.max(0.7, Math.min(1, innerHeight / 960)))); } fit(); addEventListener('resize', fit); })();
      // CesiumJS loads its workers and assets from here (works locally and on any static host).
      window.CESIUM_BASE_URL = new URL('cesium/', document.baseURI).href;
      // The app's code (about 6 MB) is downloaded here with a visible percentage on the "App" row, then started
      // from the browser cache: on a first visit with nothing cached the page would otherwise sit on the video
      // with no sign of progress. The production build calls this in place of its <script type="module">
      // (vite.config.ts, bootLoader); the dev server loads the code itself and the row just shows it is busy.
      window.__bootLoad = function (src, size) {
        var PREFETCH_IDLE_MS = 20000, PREFETCH_TOTAL_MS = 90000, MODULE_MS = 45000;
        function show(f) {
          var n = document.getElementById('boot-app-n'), l = document.getElementById('boot-app-line');
          if (n) n.textContent = Math.round(f * 100) + '%';
          if (l) { l.classList.remove('busy'); l.style.setProperty('--f', String(f)); }
        }
        function recovery(message, terminal) {
          function draw() {
            var col = document.querySelector('.boot-col');
            if (!col) return; // React has already replaced the static loading screen.
            var box = document.getElementById('boot-recovery');
            if (!box) { box = document.createElement('div'); box.id = 'boot-recovery'; box.className = 'boot-recovery'; col.appendChild(box); }
            box.setAttribute('role', terminal ? 'alert' : 'status');
            box.textContent = '';
            var p = document.createElement('p'); p.textContent = message; box.appendChild(p);
            if (terminal) {
              var button = document.createElement('button'); button.type = 'button'; button.textContent = 'Reload MOONDA';
              button.addEventListener('click', function () { location.reload(); }); box.appendChild(button);
              var n = document.getElementById('boot-app-n'), line = document.getElementById('boot-app-line');
              if (n) n.textContent = 'Could not load';
              if (line) line.classList.remove('busy');
            }
          }
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', draw, { once: true }); else draw();
        }
        function failed() { recovery('MOONDA couldn’t finish loading. Check your connection and try again.', true); }
        function start(attempt) {
          var s = document.createElement('script');
          var settled = false;
          var timer = setTimeout(function () {
            if (settled) return;
            settled = true; s.onload = s.onerror = null;
            // Removing a timed-out script cannot reliably cancel its execution. A second one could
            // start two apps, so leave recovery to a full reload in this case.
            failed();
          }, MODULE_MS);
          s.type = 'module'; s.crossOrigin = '';
          s.src = attempt ? src + (src.indexOf('?') < 0 ? '?' : '&') + 'boot-retry=' + Date.now() : src;
          s.onload = function () {
            if (settled) return;
            settled = true; clearTimeout(timer);
            // A runtime error before React mounts must also leave a way to recover.
            setTimeout(function () { if (document.querySelector('.boot-col')) failed(); }, 10000);
          };
          s.onerror = function () {
            if (settled) return;
            settled = true; clearTimeout(timer); s.remove();
            if (!attempt) { recovery('The connection was interrupted. Trying again…', false); start(1); } else failed();
          };
          document.head.appendChild(s);
        }
        if (!size || !window.fetch || !window.ReadableStream) { start(0); return; }
        // A stalled fetch need not reject. Bound headers and each body read as well as the whole
        // transfer; this timer exists before React (and its own loading watchdog) can start.
        new Promise(function (resolve, reject) {
          var ctl = window.AbortController ? new AbortController() : null;
          var reader = null, over = false, idle, total;
          function finish(error) {
            if (over) return;
            over = true; clearTimeout(idle); clearTimeout(total);
            if (error) {
              if (ctl) ctl.abort();
              if (reader) reader.cancel().catch(function () {});
              reject(error);
            } else resolve();
          }
          function touch() { clearTimeout(idle); idle = setTimeout(function () { finish(new Error('Download stalled')); }, PREFETCH_IDLE_MS); }
          total = setTimeout(function () { finish(new Error('Download timed out')); }, PREFETCH_TOTAL_MS);
          touch();
          fetch(src, { credentials: 'same-origin', signal: ctl ? ctl.signal : undefined }).then(function (r) {
            if (over) { if (r.body) r.body.cancel().catch(function () {}); return; }
            if (!r.ok || !r.body) throw new Error(String(r.status));
            reader = r.body.getReader();
            var got = 0;
            function pump() {
              return reader.read().then(function (x) {
                if (over) return;
                if (x.done) { finish(); return; }
                got += x.value.length; show(Math.min(0.99, got / size)); touch();
                return pump();
              });
            }
            return pump();
          }).catch(finish);
        }).then(function () { show(1); }, function () { recovery('The connection was interrupted. Trying again…', false); }).then(function () { start(0); });
      };
    </script>
  </head>
  <body>
    <div class="intro-bg" id="intro-bg" aria-hidden="true">
      <video id="intro-video" src="./intro/space.mp4" poster="./intro/space.jpg" autoplay muted loop playsinline preload="auto" disablepictureinpicture disableremoteplayback controlslist="nodownload nofullscreen noremoteplayback"></video>
    </div>
    <script>
      (function () {
        var video = document.getElementById('intro-video'), bg = document.getElementById('intro-bg'), disposed = false;
        function ready() { video.dataset.introReady = 'true'; video.dispatchEvent(new Event('moonda-intro-ready')); }
        function poster() { bg.classList.remove('playing'); ready(); }
        function playing() { if (!disposed && !document.hidden) bg.classList.add('playing'); ready(); }
        function play() {
          if (disposed || document.hidden || !video.isConnected) return;
          video.muted = true;
          try { var attempt = video.play(); if (attempt) attempt.catch(poster); } catch (_) { poster(); }
        }
        function visibility() { if (document.hidden) { video.pause(); poster(); } else play(); }
        function dispose() {
          disposed = true;
          document.removeEventListener('pointerdown', play);
          document.removeEventListener('touchstart', play);
          document.removeEventListener('visibilitychange', visibility);
          video.removeEventListener('playing', playing); video.removeEventListener('error', poster); video.removeEventListener('pause', poster);
          video.removeEventListener('moonda-intro-dispose', dispose);
          video.pause(); video.removeAttribute('src'); video.load();
        }
        video.addEventListener('playing', playing); video.addEventListener('error', poster); video.addEventListener('pause', poster);
        video.addEventListener('moonda-intro-dispose', dispose);
        document.addEventListener('pointerdown', play, { once: true, passive: true });
        document.addEventListener('touchstart', play, { once: true, passive: true });
        document.addEventListener('visibilitychange', visibility);
        play();
      })();
    </script>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading MOONDA">
        <div class="boot-col">
          <div class="boot-name" role="img" aria-label="MOONDA"><span aria-hidden="true">M</span><svg viewBox="0 0 88 77" aria-hidden="true"><ellipse cx="44" cy="38.5" rx="44" ry="38.5" fill="#eeeff1" /><ellipse cx="50.5" cy="34.75" rx="37.5" ry="34.75" fill="#fabc05" /></svg><span aria-hidden="true">ONDA.</span></div>
          <div class="boot-tag">Explore the Moon. Find a place to land.</div>
          <ul class="boot-stages" aria-label="What is being loaded">
            <li class="on"><span>App</span><span class="n" id="boot-app-n"></span><span class="boot-line busy" id="boot-app-line" aria-hidden="true"><i></i></span></li>
            <li><span>Moon photo</span><span class="q">Waiting</span></li>
            <li><span>Mountains</span><span class="q">Waiting</span></li>
            <li><span>Night sky</span><span class="q">Waiting</span></li>
            <li><span>Map layers</span><span class="q">Waiting</span></li>
            <li><span>Landing-site calculator</span><span class="q">Waiting</span></li>
            <li><span>South pole views</span><span class="q">Waiting</span></li>
            <li><span>Surface view</span><span class="q">Waiting</span></li>
            <li><span>Music</span><span class="q">Waiting</span></li>
          </ul>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
